name: App Store

# Promote an already-uploaded TestFlight build to the App Store: sync listing
# metadata (fastlane/metadata) and, optionally, screenshots, then submit for
# review. This is MANUAL-ONLY (workflow_dispatch) — it is deliberately NOT tied
# to `v*` tags, which already fan out to testflight.yml and release.yml. A tag
# push must never auto-submit to App Review.
#
# Because it reuses the binary already on TestFlight (skip_binary_upload in the
# `release` lane), no distribution certificate is needed — only the App Store
# Connect API key secrets.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "TestFlight build number to promote (yyMMddHHmm, printed by the beta lane). Leave blank to use the latest processed build."
        required: false
        type: string
      submit:
        description: "Submit for App Review (uncheck for a metadata-only dry run)"
        required: false
        default: true
        type: boolean
      with_screenshots:
        description: "Also upload fastlane/screenshots (populate them first)"
        required: false
        default: false
        type: boolean

concurrency:
  group: appstore
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          # fastlane depends on bundler < 3, so avoid Bundler 4.x.
          bundler: "2"

      # No Gemfile.lock is committed (see testflight.yml): resolve fresh.
      - name: Install gems
        run: bundle install

      - name: Upload metadata and submit to App Store
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          bundle exec fastlane release \
            build_number:"${{ inputs.build_number }}" \
            submit:"${{ inputs.submit }}" \
            with_screenshots:"${{ inputs.with_screenshots }}"
